<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskDeck</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@300;400;500;600&display=swap');
:root{
  --bg:#0F172A; --card:#1B2336; --muted:#272F42; --border:rgba(71,85,105,.45);
  --fg:#F8FAFC; --fg-dim:#94A3B8;
  --green:#22C55E; --amber:#F59E0B; --red:#EF4444; --blue:#3B82F6; --gray:#64748B;
  --mono:'Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:'Fira Sans',-apple-system,'Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5;min-height:100vh}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:4px}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;
  padding:10px 20px;background:rgba(15,23,42,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.topbar .brand{font-family:var(--mono);font-weight:600;font-size:15px;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.brand-dot{width:9px;height:9px;border-radius:50%;background:var(--green);flex:none}
.brand-dot.warn{background:var(--amber)} .brand-dot.bad{background:var(--red)}
.topbar .spacer{flex:1}
.topbar .stats{font-family:var(--mono);font-size:12px;color:var(--fg-dim);display:flex;gap:14px}
.topbar .stats b{color:var(--fg);font-weight:600}
main{max-width:1200px;margin:0 auto;padding:20px}
.pagenote{color:var(--fg-dim);font-size:12.5px;margin-bottom:16px}
.group{margin-bottom:28px}
.group>h2{font-size:12px;font-weight:600;letter-spacing:1px;color:var(--fg-dim);text-transform:none;
  font-family:var(--mono);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.group>h2 .cnt{color:var(--fg);background:var(--muted);border-radius:10px;padding:0 8px;font-size:11px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;
  transition:border-color .2s,transform .15s;cursor:pointer;position:relative}
.card:hover{border-color:rgba(148,163,184,.7)}
.card .row1{display:flex;align-items:center;gap:9px;margin-bottom:4px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;position:relative}
.dot.running{background:var(--green)} .dot.hang{background:var(--amber)}
.dot.spinning{background:var(--amber)} .dot.exited{background:var(--gray)}
.dot.failed,.dot.killed{background:var(--red)}
.dot.pulse::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:1px solid currentColor;
  color:inherit;animation:pulse 2s ease-out infinite}
.dot.running{color:var(--green)} .dot.hang,.dot.spinning{color:var(--amber)} .dot.failed{color:var(--red)}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){.dot.pulse::after{animation:none;opacity:.4}}
.card .name{font-weight:600;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .goal{color:var(--fg-dim);font-size:12.5px;margin:3px 0 10px;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.card .meta{display:flex;gap:14px;font-family:var(--mono);font-size:11.5px;color:var(--fg-dim);flex-wrap:wrap}
.card .meta b{color:var(--fg);font-weight:500}
.badge{font-size:10.5px;font-family:var(--mono);padding:2px 8px;border-radius:20px;border:1px solid;flex:none}
.badge.running{color:var(--green);border-color:rgba(34,197,94,.5);background:rgba(34,197,94,.08)}
.badge.hang,.badge.spinning{color:var(--amber);border-color:rgba(245,158,11,.5);background:rgba(245,158,11,.08)}
.badge.exited{color:var(--fg-dim);border-color:var(--border);background:var(--muted)}
.badge.failed,.badge.killed{color:var(--red);border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.08)}
.badge.overdue{color:var(--red);border-color:rgba(239,68,68,.5)}
.empty{text-align:center;color:var(--fg-dim);padding:70px 0}
.empty h2{font-weight:500;color:var(--fg);margin-bottom:8px}
.empty code{font-family:var(--mono);background:var(--muted);padding:2px 7px;border-radius:5px;font-size:12.5px}
/* detail */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--fg-dim);font-size:13px;margin-bottom:14px;
  background:none;border:none;padding:4px 2px}
.back:hover{color:var(--fg)}
.detail-head{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:14px}
.detail-head h1{font-size:18px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.goal-text{color:var(--fg-dim);margin-top:6px;max-width:70ch}
.cmd{font-family:var(--mono);font-size:12px;color:var(--fg);background:var(--bg);border:1px solid var(--border);
  border-radius:8px;padding:10px 12px;margin-top:12px;overflow-x:auto;white-space:pre-wrap;word-break:break-all}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.kv div{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 12px}
.kv .k{font-size:11px;color:var(--fg-dim);font-family:var(--mono)}
.kv .v{font-family:var(--mono);font-size:13px;margin-top:2px;font-weight:500}
.verdict{border-radius:12px;padding:14px 18px;margin-bottom:14px;display:flex;gap:12px;align-items:flex-start;border:1px solid}
.verdict.running{background:rgba(34,197,94,.07);border-color:rgba(34,197,94,.4)}
.verdict.hang,.verdict.spinning{background:rgba(245,158,11,.07);border-color:rgba(245,158,11,.45)}
.verdict.failed,.verdict.killed{background:rgba(239,68,68,.07);border-color:rgba(239,68,68,.45)}
.verdict.exited{background:var(--card);border-color:var(--border)}
.verdict .vt{font-weight:600;font-size:14px}
.verdict .vd{color:var(--fg-dim);font-size:12.5px;margin-top:2px}
.verdict .evi{font-family:var(--mono);font-size:11.5px;color:var(--fg-dim);margin-top:6px;display:flex;gap:16px;flex-wrap:wrap}
.verdict .evi b{color:var(--fg);font-weight:500}
.logwrap{background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden}
.logbar{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid var(--border);font-size:12px;color:var(--fg-dim)}
.logbar .t{font-family:var(--mono);font-weight:600;color:var(--fg)}
.logbar button{margin-left:auto;background:var(--muted);color:var(--fg-dim);border:1px solid var(--border);
  border-radius:7px;padding:4px 12px;font-size:12px;display:inline-flex;align-items:center;gap:6px;transition:color .15s,border-color .15s}
.logbar button:hover{color:var(--red);border-color:var(--red)}
pre.log{font-family:var(--mono);font-size:12px;line-height:1.55;padding:14px 16px;height:52vh;overflow:auto;
  white-space:pre-wrap;word-break:break-word;color:#CBD5E1;background:var(--bg)}
pre.log::-webkit-scrollbar{width:10px} pre.log::-webkit-scrollbar-thumb{background:var(--muted);border-radius:5px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--fg-dim);border-top-color:var(--fg);
  border-radius:50%;animation:rot 1s linear infinite;vertical-align:-2px}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
@media (max-width:640px){main{padding:12px} .grid{grid-template-columns:1fr} pre.log{height:46vh}}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-dot" id="brandDot"></span>TaskDeck</div>
  <div class="spacer"></div>
  <div class="stats" id="stats"></div>
</header>
<main id="app"></main>
<script>
'use strict';
var API='/api/tasks', now=Date.now()/1000;
var statusLabel={running:'运行中',hang:'无输出·疑似卡死',spinning:'无输出·疑似空转',exited:'已结束',failed:'已结束·疑似失败',killed:'已终止'};
var $=function(s){return document.querySelector(s)};
function fmtDur(s){if(s<60)return Math.floor(s)+'s';if(s<3600)return Math.floor(s/60)+'m '+Math.floor(s%60)+'s';
  return Math.floor(s/3600)+'h '+Math.floor(s%3600/60)+'m'}
function fmtAgo(ts){var d=now-ts;if(d<5)return '刚刚';if(d<60)return Math.floor(d)+'s 前';
  if(d<3600)return Math.floor(d/60)+'m 前';return Math.floor(d/3600)+'h 前'}
function esc(s){return (s||'').replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function basename(p){return (p||'').replace(/[\\/]+$/,'').split(/[\\/]/).pop()||'default'}

function health(tasks){
  var bad=0;tasks.forEach(function(t){if(['hang','spinning','failed','killed'].indexOf(t.status)>=0||t.overdue)bad++});
  return bad;
}
function updateChrome(tasks){
  var bad=health(tasks),run=tasks.filter(function(t){return['running','hang','spinning'].indexOf(t.status)>=0}).length;
  var dot=$('#brandDot');dot.className='brand-dot'+(bad?' bad':run?'':' warn');
  var base=isDetail()?'TaskDeck · '+curId():'TaskDeck';
  document.title=(bad?'⚠'+bad+' · ':'')+base;
  var fav=document.querySelector('link[rel=icon]')||(function(){var l=document.createElement('link');l.rel='icon';document.head.appendChild(l);return l})();
  var c=bad?'#EF4444':run?'#22C55E':'#64748B';
  fav.href='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#0F172A"/><circle cx="16" cy="16" r="7" fill="'+c+'"/></svg>');
}
function isDetail(){return /^\/task\//.test(location.pathname)}
function curId(){return location.pathname.split('/')[2]}

function cardInner(t){
  var elapsed=(t.ended_at||now)-t.created_at;
  var badges='<span class="badge '+t.status+'">'+statusLabel[t.status]+'</span>';
  if(t.overdue)badges+='<span class="badge overdue">超期</span>';
  var live=['running','hang','spinning'].indexOf(t.status)>=0;
  return '<div class="row1"><span class="dot '+t.status+(live?' pulse':'')+'"></span><span class="name">'+esc(t.name)+'</span>'+badges+'</div>'+
    '<div class="goal">'+esc(t.goal)+'</div>'+
    '<div class="meta"><span>时长 <b>'+fmtDur(Math.max(0,elapsed))+'</b></span>'+
    '<span>心跳 <b>'+fmtAgo(t.last_beat)+'</b></span>'+
    (t.cpu!=null?'<span>CPU <b>'+t.cpu.toFixed(0)+'%</b></span>':'')+'</div>';
}
function cardHtml(t){
  return '<a class="card" data-id="'+t.id+'" href="/task/'+t.id+'" style="text-decoration:none;color:inherit">'+cardInner(t)+'</a>';
}
function taskHash(t){
  return [t.status,t.overdue,t.log_size,t.cpu==null?'':t.cpu.toFixed(0),
    Math.floor((now-t.created_at)/10),Math.floor(now-t.last_beat/10)].join('|');
}
function sectionHtml(g,ts){
  return '<section class="group" data-group="'+esc(g)+'"><h2>'+esc(basename(g))+'<span class="cnt">'+ts.length+'</span>'+
    '<span style="font-weight:400;letter-spacing:0;font-size:11px">'+esc(g)+'</span></h2>'+
    '<div class="grid">'+ts.map(cardHtml).join('')+'</div></section>';
}
var listBuilt=false;
function renderList(tasks){
  var groups={};
  tasks.forEach(function(t){var g=t.group||'default';(groups[g]=groups[g]||[]).push(t)});
  var keys=Object.keys(groups).sort(function(a,b){
    var A=groups[a].some(function(t){return t.status==='running'||t.status==='hang'||t.status==='spinning'})?0:1;
    var B=groups[b].some(function(t){return t.status==='running'||t.status==='hang'||t.status==='spinning'})?0:1;
    return A-B});
  if(!keys.length){
    listBuilt=false;
    $('#app').innerHTML='<div class="empty"><h2>还没有被监控的任务</h2>'+
      '<p>用 <code>task-run --name 名字 --goal 目的 -- 你的命令</code> 启动后台任务</p></div>';
  }else if(!listBuilt){
    listBuilt=true;
    $('#app').innerHTML=keys.map(function(g){return sectionHtml(g,groups[g])}).join('');
  }else{
    tasks.forEach(function(t){
      var found=null;
      document.querySelectorAll('a.card[data-id]').forEach(function(el){if(el.dataset.id===t.id)found=el});
      if(found){
        var h=taskHash(t);
        if(found.dataset.h!==h){found.innerHTML=cardInner(t);found.dataset.h=h}
      }else{
        var sec=null;
        document.querySelectorAll('section[data-group]').forEach(function(el){if(el.dataset.group===t.group)sec=el});
        if(sec)sec.querySelector('.grid').insertAdjacentHTML('beforeend',cardHtml(t));
        else $('#app').insertAdjacentHTML('beforeend',sectionHtml(t.group,[t]));
      }
    });
    document.querySelectorAll('a.card[data-id]').forEach(function(a){
      var alive=tasks.some(function(t){return t.id===a.dataset.id});
      if(!alive)a.remove();
    });
    document.querySelectorAll('section[data-group]').forEach(function(sec){
      var g=sec.dataset.group;
      if(!keys.some(function(k){return k===g}))sec.remove();
    });
  }
  var run=0,done=0;
  tasks.forEach(function(t){if(['running','hang','spinning'].indexOf(t.status)>=0)run++;else done++});
  $('#stats').innerHTML='<span>活跃 <b>'+run+'</b></span><span>异常 <b style="color:'+(health(tasks)?'var(--red)':'var(--fg)')+'">'+health(tasks)+'</b></span><span>已结束 <b>'+done+'</b></span>';
}

function verdictBlock(t){
  var e=(t.ended_at||now)-t.created_at;
  var live=['running','hang','spinning'].indexOf(t.status)>=0;
  var ev='<span>已运行 <b>'+fmtDur(Math.max(0,e))+'</b></span><span>最后输出 <b>'+fmtAgo(t.last_beat)+'</b></span>'+
    '<span>日志 <b>'+(t.log_size/1024).toFixed(1)+' KB</b></span>'+
    (t.cpu!=null?'<span>CPU <b>'+t.cpu.toFixed(0)+'%</b></span>':'')+
    (t.exit_code!=null?'<span>exit <b>'+t.exit_code+'</b></span>':'');
  var desc={running:'心跳正常,日志在持续推进。',
    hang:'日志已停滞超过心跳阈值('+t.beat_seconds+'s)且 CPU 空闲——进程可能在等网络/锁/输入。查看日志尾部确认。',
    spinning:'日志停滞但 CPU 持续高占用——疑似死循环空转。建议查看日志后终止。',
    exited:'进程已退出。查看日志尾部判断结果。',
    failed:'进程已退出,日志尾部发现错误特征(Traceback / panic 等)。',
    killed:'进程已被手动终止。'}[t.status]||'';
  if(t.overdue)desc+=' 已超过声明的最长时长('+t.max_minutes+' 分钟)。';
  return '<div class="verdict '+t.status+'"><span class="dot '+t.status+(live?' pulse':'')+'" style="margin-top:5px"></span>'+
    '<div><div class="vt">'+statusLabel[t.status]+'</div><div class="vd">'+esc(desc)+'</div>'+
    '<div class="evi">'+ev+'</div></div></div>';
}
var logOffset=0,follow=true;
var renderedId=null;
function renderDetail(t){
  if(renderedId===t.id&&$('#verdict')){
    $('#verdict').outerHTML=verdictBlock(t).replace('<div class="verdict','<div id="verdict" class="verdict');
    pullLog(t.id);
    return;
  }
  renderedId=t.id;
  var killable=['running','hang','spinning'].indexOf(t.status)>=0&&t.pid;
  var html='<button class="back" onclick="history.back()">&larr; 返回大盘</button>'+
    '<div class="detail-head"><h1><span class="dot '+t.status+' pulse"></span>'+esc(t.name)+
    '<span class="badge '+t.status+'">'+statusLabel[t.status]+'</span>'+(t.overdue?'<span class="badge overdue">超期</span>':'')+'</h1>'+
    '<div class="goal-text">'+esc(t.goal)+'</div>'+
    (t.command?'<div class="cmd">'+esc(t.command)+'</div>':'')+
    '<div class="kv">'+
    '<div><div class="k">启动</div><div class="v">'+new Date(t.created_at*1000).toLocaleString()+'</div></div>'+
    '<div><div class="k">PID</div><div class="v">'+(t.pid||'—')+'</div></div>'+
    '<div><div class="k">心跳阈值</div><div class="v">'+t.beat_seconds+'s</div></div>'+
    '<div><div class="k">最长时长</div><div class="v">'+(t.max_minutes?t.max_minutes+' min':'不限')+'</div></div>'+
    '<div><div class="k">目录</div><div class="v" style="font-size:11.5px;word-break:break-all">'+esc(t.cwd||t.group)+'</div></div>'+
    '</div></div>'+
    verdictBlock(t).replace('<div class="verdict','<div id="verdict" class="verdict')+
    '<div class="logwrap"><div class="logbar"><span class="t">LOG</span><span id="logstat">'+(t.log_path?esc(t.log_path):'')+'</span>'+
    (killable?'<button id="killBtn" aria-label="终止进程"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg>终止进程</button>':'')+
    '</div><pre class="log" id="log">载入中…</pre></div>';
  $('#app').innerHTML=html;
  var kb=$('#killBtn');
  if(kb)kb.onclick=function(){
    if(kb.dataset.arm){fetch('/api/tasks/'+t.id+'/kill',{method:'POST'}).then(function(){renderedId=null;loadOnce()})}
    else{kb.dataset.arm='1';kb.style.color='var(--red)';kb.style.borderColor='var(--red)';kb.innerHTML='确认终止?'}
  };
  var pre=$('#log');
  pre.onscroll=function(){follow=pre.scrollTop+pre.clientHeight>=pre.scrollHeight-24};
  logOffset=0;pre.textContent='';
  follow=true;
  pullLog(t.id);
}
function pullLog(id){
  fetch('/api/tasks/'+id+'/log?offset='+logOffset).then(function(r){return r.json()}).then(function(d){
    var pre=$('#log');if(!pre)return;
    if(d.offset<logOffset)pre.textContent='';
    logOffset=d.offset;
    if(d.chunk){pre.textContent+=d.chunk;
      if(follow)pre.scrollTop=pre.scrollHeight;
      var st=$('#logstat');if(st){st.textContent=d.size+' bytes · 跟随中(上滚暂停)';st.dataset.idle=''}}
    else{var st=$('#logstat');if(st&&!st.dataset.idle){st.dataset.idle='1';st.textContent+=' · 无新输出'}}
  }).catch(function(){});
}
var listBuilt=false,detailMode=null;
function loadOnce(){
  var dv=isDetail();
  if(detailMode!==null&&detailMode!==dv){listBuilt=false;renderedId=null}
  detailMode=dv;
  fetch(API).then(function(r){return r.json()}).then(function(d){
    now=d.now;var tasks=d.tasks;
    updateChrome(tasks);
    if(isDetail()){
      var t=tasks.filter(function(x){return x.id===curId()})[0];
      if(!t){$('#app').innerHTML='<div class="empty"><h2>任务不存在</h2><p><a href="/">返回大盘</a></p></div>';return}
      renderDetail(t);
    }else{renderList(tasks)}
  }).catch(function(){});
}
function loop(){
  now=Date.now()/1000;
  loadOnce();
}
loop();
setInterval(loop,2500);
window.addEventListener('popstate',loop);
var _push=history.pushState;
history.pushState=function(){_push.apply(this,arguments);logOffset=0;loop()};
</script>
</body>
</html>
